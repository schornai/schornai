name: Feature request
description: Suggest an improvement to schorn.ai.
body:
  - type: markdown
    attributes:
      value: English and German are welcome. Please search existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs it and a concrete use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the outcome you want and any alternatives you considered.
    validations:
      required: true
